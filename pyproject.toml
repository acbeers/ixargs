[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ixargs"
version = "0.1.0"
description = "Interactive xargs — run commands against stdin lines in a split-pane TUI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "textual>=7.4.0",
]

[project.scripts]
ixargs = "ixargs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ixargs"]

[tool.hatch.build.targets.wheel.force-include]
"ixargs/app.css" = "ixargs/app.css"
