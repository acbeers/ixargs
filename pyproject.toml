[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ixargs"
dynamic = ["version"]
description = "Interactive xargs — run commands against stdin lines in a split-pane TUI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "textual>=7.4.0",
]

[project.scripts]
ixargs = "ixargs.cli:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+dev"

[tool.hatch.build.hooks.vcs]
version-file = "ixargs/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["ixargs"]

[tool.hatch.build.targets.wheel.force-include]
"ixargs/app.css" = "ixargs/app.css"

[tool.hatch.build.targets.sdist]
include = ["ixargs", "man/**", "pyproject.toml", "README.md"]
