# Build source distribution and create a GitHub release on version tags.
# Usage: git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build source distribution
        run: uv build --sdist

      - name: Rename tarball for release
        run: |
          set -euo pipefail
          # Extract version from tag (e.g., v0.1.0 -> 0.1.0)
          VERSION=${GITHUB_REF_NAME#v}
          TARGET="dist/ixargs-${VERSION}.tar.gz"

          # Find the built tarball (e.g., ixargs-0.1.0.tar.gz)
          shopt -s nullglob
          TARBALLS=(dist/ixargs-*.tar.gz)
          if [ "${#TARBALLS[@]}" -eq 0 ]; then
            echo "No tarballs found in dist/" >&2
            exit 1
          fi
          TARBALL="${TARBALLS[0]}"

          # Copy to predictable name for release (skip if already correct)
          if [ "$TARBALL" != "$TARGET" ]; then
            cp "$TARBALL" "$TARGET"
          else
            echo "Tarball already named $TARGET; skipping copy."
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ixargs-sdist
          path: dist/ixargs-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts for release
        run: |
          mkdir -p release-files
          find release-artifacts -name "*.tar.gz" -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: release-files/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
